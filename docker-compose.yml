services:
  db:
    image: mysql:8.0
    container_name: saeta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
      MYSQL_USER: ${MYSQL_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_DB_PASS}
    ports:
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - saeta_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saeta_app
    restart: always
    volumes:
      - ./src:/var/www/html
    networks:
      - saeta_net

  web:
    image: nginx:alpine
    container_name: saeta_web
    restart: always
    ports:
      - "${WEB_EXTERNAL_PORT}:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - saeta_net

networks:
  saeta_net:
    driver: bridge